name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check app.mjs
      - run: node --check serve.mjs
      - run: node --test
      - run: node pivot.mjs example.json
